# Qwen3-TTS C600 编排 v6 - S1=16 变体
# 基于用户 600 实际配置(optimized mcdnn 后),仅改两处:
#   stage1 max_num_seqs: 12 -> 16
#   decode_batch_max_size: 12 -> 16
# 其余字段与用户配置完全一致(tf32=true, stage0 prefix caching=true,
# gpu_mem 0.4, stage1 enforce_eager=false, chunk=50, 无 ramp)。
# 目的:kernel 已优化,减少 stage1 排队,c=16/32 的 fpa 预期下降。

async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      connector_get_sleep_s: 0.001
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 50
      codec_left_context_frames: 72
      ref_code_context_frames: 72
      initial_codec_chunk_frames: 1
      # codec_chunk_ramp: [4, 4, 8, 16, 25]
      decode_batch_max_size: 12
      decode_enable_tf32: true

stages:
  - stage_id: 0
    max_num_seqs: 64
    gpu_memory_utilization: 0.4
    trust_remote_code: true
    enable_prefix_caching: true
    async_scheduling: true
    max_num_batched_tokens: 512
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      min_tokens: 2
      repetition_penalty: 1.05
    subtalker_sampling_params:
      do_sample: true
      temperature: 0.9
      top_k: 50
      top_p: 1.0

  - stage_id: 1
    max_num_seqs: 12
    gpu_memory_utilization: 0.4
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 65536
    max_model_len: 65536
    devices: "1"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      repetition_penalty: 1.0

platforms:
  maca:
    stages:
      - stage_id: 1
        enforce_eager: false
